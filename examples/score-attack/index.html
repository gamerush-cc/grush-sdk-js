<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Score Attack</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
      main { max-width: 360px; margin: 0 auto; padding: 24px 16px; text-align: center; }
      button { width: 100%; padding: 32px 0; font-size: 28px; border: 0; border-radius: 12px; }
      ol { text-align: left; padding-left: 24px; }
      .muted { color: #999; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>10 秒タップ</h1>
      <p id="player" class="muted"></p>
      <button id="tap" type="button">スタート</button>
      <p id="status"></p>
      <ol id="board"></ol>
      <p class="muted">スコアは自己申告です。</p>
    </main>
    <script src="../../grush-sdk.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
